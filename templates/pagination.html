{% if page.paginator.num_pages > 1 %}<div class="pagination"><span>第 {{ page.number }} / {{ page.paginator.num_pages }} 页</span><div>{% if page.has_previous %}<a href="?{{ params }}&page={{ page.previous_page_number }}">上一页</a>{% endif %}{% if page.has_next %}<a href="?{{ params }}&page={{ page.next_page_number }}">下一页 →</a>{% endif %}</div></div>{% endif %}
