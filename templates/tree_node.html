<details class="tree-node" {% if node.expanded %}open{% endif %}><summary><a href="/?category={{ node.category.pk }}" class="{% if node.category == active_category and not active_product %}tree-selected{% endif %}">{{ node.category.name }}</a>{% if not node.enabled %}<span class="review-tag">停用</span>{% endif %}</summary><div class="tree-children">{% for child in node.children %}{% include 'tree_node.html' with node=child %}{% endfor %}{% for product in node.products %}<details class="tree-product" {% if active_product.pk == product.pk %}open{% endif %}><summary><a class="{% if active_product.pk == product.pk %}tree-selected{% endif %}" href="/?product={{ product.pk }}">{{ product.name }}</a></summary><a class="tree-leaf {% if active_product.pk == product.pk and coverage == 'main' %}tree-selected{% endif %}" href="/?product={{ product.pk }}&coverage=main">主险 <span>条款 / 费率</span></a><a class="tree-leaf {% if active_product.pk == product.pk and coverage == 'rider' %}tree-selected{% endif %}" href="/?product={{ product.pk }}&coverage=rider">附加险 <span>条款 / 费率</span></a></details>{% endfor %}</div></details>
