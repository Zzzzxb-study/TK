{% extends 'base.html' %}{% block content %}<div class="heading"><div><div class="eyebrow">RECYCLE BIN</div><h1>回收站</h1><p class="muted">已删除资料不能下载。恢复后重新出现在条款库中。</p></div></div><div class="panel table-wrap"><table><thead><tr><th>资料名称</th><th>删除人</th><th>删除时间</th><th>操作</th></tr></thead><tbody>{% for doc in page %}<tr><td>{{ doc.title }}</td><td>{{ doc.deleted_by }}</td><td>{{ doc.deleted_at|date:'Y-m-d H:i' }}</td><td><form method="post" action="{% url 'restore' doc.pk %}">{% csrf_token %}<button class="text-button">恢复资料</button></form></td></tr>{% empty %}<tr><td colspan="4" class="empty">回收站为空</td></tr>{% endfor %}</tbody></table>{% include 'pagination.html' %}</div>{% endblock %}
